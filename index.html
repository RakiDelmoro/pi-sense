<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pisense | Home Monitoring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2.5"/>
            <circle cx="16" cy="16" r="5" fill="currentColor"/>
            <line x1="16" y1="2" x2="16" y2="8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="16" y1="24" x2="16" y2="30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="2" y1="16" x2="8" y2="16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="24" y1="16" x2="30" y2="16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-name">Pisense</h1>
          <p class="brand-tagline">Your Data, Your Home, Your View</p>
        </div>
      </div>
      <div class="header-meta">
        <span class="connection-status" id="connection-status">
          <span class="status-dot"></span>
          Connected
        </span>
        <span class="last-sync" id="last-sync">Synced just now</span>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <section class="dashboard-section" aria-label="Sensor Overview">
        <div class="section-header">
          <h2 class="section-title">Sensors</h2>
          <span class="sensor-count" id="sensor-count">0 active</span>
        </div>
        <div class="sensor-grid" id="sensor-grid">
          <!-- Sensor cards rendered by TypeScript -->
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Pisense. Built for your home.</p>
    </div>
  </footer>

  <script type="module" src="dist/app.js"></script>
</body>
</html>
