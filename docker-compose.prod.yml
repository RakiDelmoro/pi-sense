name: pi-sense-prod

services:
  dashboard:
    container_name: pi-sense-prod-dashboard
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3141:3141"
    env_file:
      - .env
    depends_on:
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  # ── InfluxDB (time-series database) ─────────────────────────
  #  No ports exposed — internal only. Access via SSH tunnel if needed:
  #    ssh -L 8086:localhost:8086 user@server
  influxdb:
    container_name: pi-sense-prod-influxdb
    image: influxdb:2.7
    # No ports mapping — not exposed to the network
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:-pi-sense-admin}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG:-pi-sense}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET:-pi-sense}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN:-pi-sense-dev-token}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Mosquitto (MQTT broker) ─────────────────────────────────
  mosquitto:
    container_name: pi-sense-prod-mosquitto
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    volumes:
      - ./mosquitto-prod.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/config/auth
      - ./mosquitto-entrypoint.sh:/docker-entrypoint.sh:ro
    entrypoint: ["sh", "/docker-entrypoint.sh"]
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    restart: unless-stopped

volumes:
  influxdb-data:
  mosquitto-data:
