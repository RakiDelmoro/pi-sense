name: pi-sense-dev
services:
  app:
    container_name: pi-sense-dev-app
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      # Project source (bind mount)
      - .:/workspaces/pi-sense
      # Separate volume for node_modules so host OS doesn't interfere
      - node-modules-data:/workspaces/pi-sense/node_modules
      # Persist entire home directory so user-installed tools survive
      # container restarts (npm -g, bun -g, pi install, apt, etc.)
      - home-data:/root
    command: sleep infinity
    depends_on:
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_started

  influxdb:
    container_name: pi-sense-dev-influxdb
    image: influxdb:2.7
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=pi-sense-admin
      - DOCKER_INFLUXDB_INIT_ORG=pi-sense
      - DOCKER_INFLUXDB_INIT_BUCKET=pi-sense
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=pi-sense-dev-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mosquitto:
    container_name: pi-sense-dev-mosquitto
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto-dev.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

volumes:
  influxdb-data:
  node-modules-data:
  home-data:
