name: pi-sense-dev
services:
  app:
    container_name: pi-sense-dev-app
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      # Project source (bind mount)
      - .:/workspaces/pi-sense
    command: sleep infinity
    depends_on:
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_started

  influxdb:
    container_name: pi-sense-dev-influxdb
    image: influxdb:2.7
    env_file:
      - .env.development
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mosquitto:
    container_name: pi-sense-dev-mosquitto
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto-dev.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

volumes:
  influxdb-data:

